<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; margin: 0; background: #f7f8fa; color: #1d1d1f; }
.header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
.header h1 { margin: 0; font-size: 20px; font-weight: 600; }
.header .sub { font-size: 12px; color: #888; margin-top: 2px; }
.badge { background: #eef2ff; color: #4f46e5; padding: 4px 12px; border-radius: 20px; font-size: 13px; }
.summary { margin: 16px; background: #4a6fa5; color: #fff; border-radius: 12px; padding: 16px; }
.summary .warn { background: #fff; color: #4a6fa5; display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 13px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.stat { background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; }
.stat .label { font-size: 12px; opacity: 0.9; }
.stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
.progress-wrap { margin-top: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.progress { height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; }
.progress-bar { height: 100%; background: #fff; border-radius: 3px; width: 75.6%; }
.limit { font-size: 12px; opacity: 0.8; margin-top: 4px; }
.tabs { display: flex; gap: 8px; margin: 0 16px 12px; }
.tab { padding: 8px 20px; background: #fff; border-radius: 8px; font-weight: 500; cursor: pointer; }
.tab.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.filters { display: flex; gap: 8px; margin: 0 16px 16px; flex-wrap: wrap; }
.filter { background: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #e5e5e5; }
.categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 0 16px 32px; }
.cat { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.cat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.cat-name { font-size: 16px; font-weight: 600; }
.cat-total { font-size: 18px; font-weight: 600; }
.cat-meta { font-size: 12px; color: #888; margin-bottom: 12px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #f0f0f0; }
.tag.p0 { background: #fee2e2; color: #dc2626; }
.tag.p1 { background: #fef3c7; color: #d97706; }
.tag.p2 { background: #f3f4f6; color: #6b7280; }
.tag.room { background: #dbeafe; color: #2563eb; }
.tag.status-未付 { background: #fee2e2; color: #dc2626; }
.tag.status-部分付 { background: #fef3c7; color: #d97706; }
.tag.status-已付 { background: #dcfce7; color: #16a34a; }
.item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.item:last-child { border-bottom: none; }
.item-name { font-weight: 500; }
.item-right { text-align: right; }
.item-actual { font-weight: 600; }
.item-budget { font-size: 12px; color: #888; }
@media (max-width: 768px) { .stats { grid-template-columns: 1fr 1fr; } .categories { grid-template-columns: 1fr; } }
</style>
</head>
